<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoundPulse</title>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root {
            --bg-black: #000000;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent: #fe2c55;
            --accent-cyan: #25f4ee;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #2a2a2a;
            --nav-height: 60px;
            --player-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            user-select: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- CONTROL DE PANTALLAS --- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            z-index: 30;
        }

        /* --- AUTH SCREEN --- */
        #auth-screen {
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            padding: 20px;
            z-index: 100; /* Asegura que esté siempre al frente para recibir clics */
        }

        .auth-card {
            background-color: rgba(24, 24, 24, 0.95);
            border: 1px solid var(--border-color);
            padding: 30px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            z-index: 101;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .auth-mode-selector {
            display: flex;
            background: #282828;
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 15px;
            position: relative;
            z-index: 102;
        }

        .auth-mode-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto; /* Forzar interactividad táctil y de mouse */
        }

        .auth-mode-btn.active {
            background: #383838;
            color: #fff;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #282828;
            color: #fff;
            outline: none;
            position: relative;
            z-index: 102;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            position: relative;
            z-index: 102;
            pointer-events: auto;
        }

        /* --- HEADER TOP --- */
        .top-header {
            height: 50px;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 20;
        }

        .top-header h2 {
            font-size: 0.95rem;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .content-area {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding-top: 50px;
            padding-bottom: calc(var(--nav-height) + var(--player-height));
        }

        .tab-content.active {
            display: block;
        }

        /* --- FEED TIKTOK --- */
        #tab-feed {
            padding-top: 0;
            padding-bottom: var(--nav-height);
            height: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            background-color: #000;
        }

        .tiktok-post {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
        }

        .media-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tiktok-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mp3-cover-display {
            width: 280px;
            height: 280px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #333;
        }

        .tiktok-sidebar {
            position: absolute;
            right: 12px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }

        .side-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .side-action-btn svg {
            width: 28px;
            height: 28px;
            fill: #fff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        .side-action-btn span {
            font-size: 0.7rem;
            margin-top: 3px;
            font-weight: 600;
        }

        .disc-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 6px solid #222;
            background: #111;
            animation: spin 4s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .disc-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .tiktok-info {
            position: absolute;
            left: 15px;
            bottom: 85px;
            z-index: 10;
            max-width: 75%;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }

        .tiktok-info .username-tag {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
            cursor: pointer;
            display: inline-block;
        }

        .tiktok-info .description-text {
            font-size: 0.85rem;
            color: #eee;
            margin-bottom: 6px;
        }

        .tiktok-info .sound-track {
            font-size: 0.75rem;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tiktok-info .sound-track svg {
            width: 12px;
            height: 12px;
            fill: #ccc;
        }

        /* --- BUSCADOR --- */
        .tiktok-search-box {
            margin: 15px;
            background: #222224;
            border-radius: 25px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
        }

        .tiktok-search-box input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }

        .user-search-result {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .user-result-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-result-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* --- PERFIL --- */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            text-align: center;
        }

        .profile-avatar-box {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent));
            margin-bottom: 10px;
            cursor: pointer;
        }

        .profile-avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #000;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            width: 100%;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-num {
            font-weight: 700;
            font-size: 1rem;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .grid-posts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            margin-top: 15px;
        }

        .grid-item {
            aspect-ratio: 3/4;
            background-color: #1a1a1a;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- REPRODUCTOR FLOTANTE --- */
        .player-footer {
            position: fixed;
            bottom: var(--nav-height);
            left: 0;
            width: 100%;
            height: var(--player-height);
            background-color: #121212;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 40;
        }

        .player-controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 65px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* --- BOTTOM NAV TIKTOK --- */
        .bottom-nav-tiktok {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background-color: #000000;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }

        .nav-item {
            background: none;
            border: none;
            color: #888;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: #888;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item.active svg {
            fill: #fff;
        }

        .upload-btn-tiktok {
            width: 42px;
            height: 28px;
            background: linear-gradient(90deg, var(--accent-cyan) 0%, var(--accent) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .upload-btn-tiktok svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }

        /* --- PANEL DE COMENTARIOS --- */
        .comments-panel {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 60vh;
            background-color: #181818;
            border-radius: 16px 16px 0 0;
            z-index: 100;
            transition: bottom 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .comments-panel.open {
            bottom: 0;
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .comment-item {
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .comment-user {
            font-weight: bold;
            color: #ccc;
        }

        /* --- MODALES GENERALES --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-card);
            padding: 22px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .modal-content input {
            padding: 10px 12px;
            background-color: #282828;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* DRAWER LATERAL */
        .side-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121212;
            z-index: 150;
            transition: left 0.3s ease;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .side-drawer.open {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-links {
            list-style: none;
            padding: 15px 0;
        }

        .drawer-links li {
            padding: 12px 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .drawer-links li svg {
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- PANTALLA LOGIN / REGISTRO -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h1 class="logo">SoundPulse</h1>
            <p class="subtitle">Música y Videos Cortos</p>
            
            <div class="auth-mode-selector">
                <button id="btn-mode-login" class="auth-mode-btn active" type="button" onclick="setAuthMode('login')">Iniciar Sesión</button>
                <button id="btn-mode-register" class="auth-mode-btn" type="button" onclick="setAuthMode('register')">Registrarse</button>
            </div>

            <input type="text" id="auth-user" placeholder="Nombre de usuario" autocomplete="off">
            <input type="password" id="auth-pass" placeholder="Contraseña">
            
            <button class="btn-primary" id="auth-submit-btn" type="button" onclick="handleAuth()">Entrar</button>
            <p id="auth-error" style="color: var(--accent); font-size: 0.75rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-screen" class="screen">
        
        <!-- HEADER TOP -->
        <header class="top-header">
            <button class="icon-btn" onclick="toggleSideMenu()">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <h2 id="top-title">FEED</h2>
            <button class="icon-btn" onclick="openCreatePlaylistModal()">
                <svg viewBox="0 0 24 24"><path d="M14 10H3v2h11v-2zm0-4H3v2h11V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM3 16h7v-2H3v2z"/></svg>
            </button>
        </header>

        <!-- MENÚ LATERAL -->
        <aside id="side-menu" class="side-drawer">
            <div class="drawer-header">
                <h3>SoundPulse</h3>
                <button class="icon-btn" onclick="toggleSideMenu()">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <ul class="drawer-links">
                <li onclick="switchTab('feed')">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Feed / Para Ti
                </li>
                <li onclick="switchTab('playlists')">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg> Mis Playlists
                </li>
                <li onclick="switchTab('myposts')">
                    <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg> Mis Posts
                </li>
                <li onclick="switchTab('profile')">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Mi Perfil
                </li>
                <li onclick="logout()" style="color: var(--accent);">
                    <svg viewBox="0 0 24 24" style="fill: var(--accent);"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg> Cerrar Sesión
                </li>
            </ul>
        </aside>

        <!-- ÁREA DE CONTENIDO -->
        <main class="content-area">
            
            <!-- FEED PRINCIPAL -->
            <section id="tab-feed" class="tab-content active">
                <div id="feed-container"></div>
            </section>

            <!-- BUSCADOR -->
            <section id="tab-search" class="tab-content">
                <div class="tiktok-search-box">
                    <input type="text" id="search-input" placeholder="Buscar usuarios en SoundPulse" oninput="searchUsers()">
                    <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #888;"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <div id="search-results"></div>
            </section>

            <!-- PLAYLISTS -->
            <section id="tab-playlists" class="tab-content">
                <div style="padding: 15px;">
                    <h3>Mis Playlists</h3>
                    <div id="playlists-list" style="margin-top: 15px;"></div>
                </div>
            </section>

            <!-- MIS POSTS -->
            <section id="tab-myposts" class="tab-content">
                <div style="padding: 15px;">
                    <button class="btn-primary" style="margin-bottom: 15px;" onclick="openUploadModal()">+ Subir Contenido</button>
                    <div id="myposts-container" class="grid-posts"></div>
                </div>
            </section>

            <!-- PERFIL -->
            <section id="tab-profile" class="tab-content">
                <div class="profile-container">
                    <div class="profile-avatar-box" onclick="triggerAvatarUpload()">
                        <img id="profile-avatar-img" src="https://via.placeholder.com/150" alt="Avatar">
                    </div>
                    <input type="file" id="avatar-file-input" style="display:none" accept="image/*" onchange="uploadAvatar(event)">
                    
                    <h3 id="profile-username">@usuario</h3>
                    
                    <div id="profile-actions" style="margin-top: 10px;">
                        <button class="btn-primary" style="padding: 6px 20px; font-size: 0.8rem;" onclick="triggerAvatarUpload()">Cambiar Foto</button>
                    </div>

                    <div class="profile-stats">
                        <div class="stat-item"><span class="stat-num" id="stat-followers">0</span><span class="stat-label">Followers</span></div>
                        <div class="stat-item"><span class="stat-num" id="stat-following">0</span><span class="stat-label">Following</span></div>
                        <div class="stat-item"><span class="stat-num" id="stat-likes">0</span><span class="stat-label">Likes</span></div>
                    </div>

                    <div class="grid-posts" id="user-posts-grid"></div>
                </div>
            </section>

        </main>

        <!-- PANEL DE COMENTARIOS -->
        <div id="comments-panel" class="comments-panel">
            <div class="comments-header">
                <h4>Comentarios</h4>
                <button class="icon-btn" onclick="toggleComments()">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="comments-list" id="comments-list"></div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <input type="text" id="comment-input" placeholder="Añadir comentario..." style="flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #333; background: #222; color: #fff;">
                <button class="btn-primary" style="border-radius: 20px; width: auto; padding: 0 15px;" onclick="addComment()">Enviar</button>
            </div>
        </div>

        <!-- REPRODUCTOR FLOTANTE -->
        <footer id="player-bar" class="player-footer">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div id="player-cover" class="song-cover-mini" style="width:38px; height:38px; background:#333; border-radius:4px; overflow:hidden;">
                    <img id="player-cover-img" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
                </div>
                <div>
                    <div id="player-title" style="font-size: 0.8rem; font-weight: bold;">Sin reproducción</div>
                    <div id="player-artist" style="font-size: 0.7rem; color: #888;">-</div>
                </div>
            </div>
            <div class="player-controls-group">
                <button id="play-pause-btn" class="icon-btn" onclick="togglePlayPause()">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: #888;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
            </div>
            <audio id="global-audio-player" style="display:none;"></audio>
        </footer>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav-tiktok">
            <button class="nav-item active" onclick="switchTab('feed')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </button>
            <button class="nav-item" onclick="switchTab('search')">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>Discover</span>
            </button>
            
            <button class="upload-btn-tiktok" onclick="openUploadModal()">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            
            <button class="nav-item" onclick="switchTab('playlists')">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                <span>Playlists</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Me</span>
            </button>
        </nav>
    </div>

    <!-- MODAL SUBIR POST -->
    <div id="modal-upload" class="modal">
        <div class="modal-content">
            <h3>Publicar Contenido</h3>
            <input type="text" id="post-title-input" placeholder="Título del tema/video">
            <input type="text" id="post-desc-input" placeholder="Descripción (#hashtags)">
            
            <label style="font-size: 0.75rem; color: #aaa;">Archivo multimedia (MP3 / MP4):</label>
            <input type="file" id="post-file-input" accept="video/mp4,audio/mp3,audio/mpeg" onchange="checkFileType(event)">
            
            <div id="mp3-cover-container" style="display:none;">
                <label style="font-size: 0.75rem; color: #aaa;">Imagen de Portada para MP3 (Cuadrada):</label>
                <input type="file" id="post-cover-input" accept="image/*">
            </div>

            <button class="btn-primary" onclick="submitPost()">Publicar</button>
            <button class="btn-secondary" onclick="closeModal('modal-upload')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL CREAR PLAYLIST -->
    <div id="modal-playlist" class="modal">
        <div class="modal-content">
            <h3>Nueva Playlist</h3>
            <input type="text" id="pl-name-input" placeholder="Nombre de la playlist">
            <button class="btn-primary" onclick="createPlaylist()">Crear</button>
            <button class="btn-secondary" onclick="closeModal('modal-playlist')">Cancelar</button>
        </div>
    </div>

    <!-- SCRIPT CORREGIDO SIN ALTERAR TUS FUNCIONES -->
    <script>
        const socket = io();

        let currentUser = null;
        let currentAuthMode = 'login';
        let currentTab = 'feed';
        let activeCommentsPostId = null;

        function setAuthMode(mode) {
            currentAuthMode = mode;
            const loginBtn = document.getElementById('btn-mode-login');
            const registerBtn = document.getElementById('btn-mode-register');
            const submitBtn = document.getElementById('auth-submit-btn');
            const errorText = document.getElementById('auth-error');
            
            errorText.innerText = '';

            if (mode === 'login') {
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
                submitBtn.innerText = 'Entrar';
            } else {
                registerBtn.classList.add('active');
                loginBtn.classList.remove('active');
                submitBtn.innerText = 'Registrarse';
            }
        }

        function handleAuth() {
            const userinput = document.getElementById('auth-user').value.trim();
            const passinput = document.getElementById('auth-pass').value.trim();
            const errorText = document.getElementById('auth-error');

            if (!userinput || !passinput) {
                errorText.innerText = 'Por favor completa todos los campos.';
                return;
            }

            if (currentAuthMode === 'register') {
                socket.emit('register', { username: userinput, password: passinput }, (response) => {
                    if (response && response.success) {
                        currentUser = response.user;
                        initApp();
                    } else {
                        errorText.innerText = (response && response.message) || 'Ya hay una cuenta con ese nombre.';
                    }
                });
            } else {
                socket.emit('login', { username: userinput, password: passinput }, (response) => {
                    if (response && response.success) {
                        currentUser = response.user;
                        initApp();
                    } else {
                        errorText.innerText = (response && response.message) || 'Usuario o contraseña incorrectos.';
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const passInput = document.getElementById('auth-pass');
            if (passInput) {
                passInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        handleAuth();
                    }
                });
            }
        });

        function initApp() {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('app-screen').classList.add('active');
            document.getElementById('profile-username').innerText = `@${currentUser.username}`;
            document.getElementById('stat-followers').innerText = currentUser.followers ? currentUser.followers.length : 0;
            document.getElementById('stat-following').innerText = currentUser.following ? currentUser.following.length : 0;
            
            if (currentUser.avatar) {
                document.getElementById('profile-avatar-img').src = currentUser.avatar;
            }

            socket.emit('get-feed');
            socket.emit('get-playlists');
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            document.querySelectorAll('.bottom-nav-tiktok .nav-item').forEach(item => item.classList.remove('active'));
            
            const titles = {
                'feed': 'FEED',
                'search': 'DESCUBRIR',
                'playlists': 'PLAYLISTS',
                'myposts': 'MIS POSTS',
                'profile': 'MI PERFIL'
            };
            
            document.getElementById('top-title').innerText = titles[tabId] || 'SOUNDPULSE';

            if (tabId === 'myposts') {
                loadMyPosts();
            } else if (tabId === 'profile') {
                loadUserProfilePosts();
            }
        }

        function toggleSideMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        function toggleComments(postId) {
            const panel = document.getElementById('comments-panel');
            if (postId) {
                activeCommentsPostId = postId;
                panel.classList.add('open');
                socket.emit('get-comments', { postId });
            } else {
                panel.classList.remove('open');
                activeCommentsPostId = null;
            }
        }

        function addComment() {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text || !activeCommentsPostId) return;

            socket.emit('add-comment', { postId: activeCommentsPostId, text }, (response) => {
                if (response && response.success) {
                    input.value = '';
                    socket.emit('get-comments', { postId: activeCommentsPostId });
                }
            });
        }

        socket.on('render-comments', (comments) => {
            const list = document.getElementById('comments-list');
            list.innerHTML = '';
            comments.forEach(c => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `<span class="comment-user">@${c.username}:</span> <span class="comment-text">${c.text}</span>`;
                list.appendChild(item);
            });
        });

        function togglePlayPause() {
            const audio = document.getElementById('global-audio-player');
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');

            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        function setVolume(val) {
            const audio = document.getElementById('global-audio-player');
            audio.volume = val;
        }

        function openUploadModal() {
            document.getElementById('modal-upload').classList.add('active');
        }

        function openCreatePlaylistModal() {
            document.getElementById('modal-playlist').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function checkFileType(event) {
            const file = event.target.files[0];
            const coverContainer = document.getElementById('mp3-cover-container');
            if (file && file.type.includes('audio')) {
                coverContainer.style.display = 'block';
            } else {
                coverContainer.style.display = 'none';
            }
        }

        function submitPost() {
            const title = document.getElementById('post-title-input').value.trim();
            const fileInput = document.getElementById('post-file-input');

            if (!title || fileInput.files.length === 0) {
                alert('Por favor añade un título y un archivo multimedia.');
                return;
            }

            closeModal('modal-upload');
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-screen').classList.remove('active');
            document.getElementById('auth-screen').classList.add('active');
            document.getElementById('auth-user').value = '';
            document.getElementById('auth-pass').value = '';
        }

        function searchUsers() {
            const query = document.getElementById('search-input').value.trim();
            socket.emit('search-users', { query });
        }

        socket.on('search-results', (results) => {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            results.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-search-result';
                div.innerHTML = `
                    <div class="user-result-info">
                        <img src="${u.avatar || 'https://via.placeholder.com/150'}" alt="Avatar">
                        <span>@${u.username}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        });

        function loadMyPosts() {
            socket.emit('get-my-posts');
        }

        function loadUserProfilePosts() {
            socket.emit('get-user-posts', { username: currentUser.username });
        }

        function triggerAvatarUpload() {
            document.getElementById('avatar-file-input').click();
        }

        function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('profile-avatar-img').src = base64;
                socket.emit('update-avatar', { avatar: base64 });
            };
            reader.readAsDataURL(file);
        }

        function createPlaylist() {
            const name = document.getElementById('pl-name-input').value.trim();
            if (!name) return;
            socket.emit('create-playlist', { name }, (res) => {
                if (res && res.success) {
                    closeModal('modal-playlist');
                    socket.emit('get-playlists');
                }
            });
        }
    </script>
</body>
</html>
